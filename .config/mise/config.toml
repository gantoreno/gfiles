min_version = "2026.9.5"

[settings]
idiomatic_version_file_enable_tools = ["node", "python", "java"]

# Personal defaults; project mise.toml files can select other versions.
# "latest" and prefixes resolve to the newest installed match; run
# `mise upgrade` to install newer releases.
[tools]
# Node's odd-numbered releases never become LTS.
node = "lts"
python = "latest"
go = "latest"
# Keep the JetBrains JCEF 21 runtime; "latest" would select another vendor.
java = "jetbrains-jcef-21"
bun = "latest"
pnpm = "latest"
# Yarn 1 (classic); projects select Berry through their packageManager field.
yarn = "1"
uv = "latest"
lazygit = "latest"
zoxide = "latest"
ripgrep = "latest"
gh = "latest"
fd = "latest"
fzf = "latest"
herdr = "latest"
vercel = "latest"
op = "latest"
# pipx installs through uv when it is available.
"pipx:aws-mfa" = "latest"
# This scoped package is the existing OpenCode distribution. It was first
# published in September 2026, so approve its package-age check explicitly.
# Its reviewed postinstall selects and links the platform-specific binary.
"npm:@opencode/cli" = { version = "latest", allow_low_downloads = true, allow_builds = ["@opencode/cli"] }
claude-code = "latest"
codex = "latest"
"github:can1357/oh-my-pi" = "latest"
