min_version = "2026.10.17"

# Mise's native Homebrew installer works on Apple Silicon and Linux x64/arm64.
# Existing Homebrew installations satisfy these entries without upgrading them.
[bootstrap.packages]
"brew:git" = "latest"
"brew:gcc" = "latest"
"brew:zsh" = "latest"
"brew:starship" = "latest"
"brew:fastfetch" = "latest"
"brew:tmux" = "latest"
"brew:neovim" = "latest"
"brew:ollama" = "latest"

# Cloned before dotfiles are linked. Oh My Zsh keeps itself updated.
[bootstrap.repos]
"~/.oh-my-zsh" = { url = "https://github.com/ohmyzsh/ohmyzsh" }
"~/.tmux/plugins/tpm" = { url = "https://github.com/tmux-plugins/tpm" }

# The repository mirrors ~. Directories are linked whole, so files an
# application creates in them land in this repository.
[dotfiles]
"~/.zshenv" = ".zshenv"
"~/.zshrc" = ".zshrc"
"~/.tmux.conf" = ".tmux.conf"
"~/.config/nvim" = ".config/nvim"
"~/.config/ghostty" = ".config/ghostty"
"~/.config/opencode" = ".config/opencode"
# Make personal tool versions available outside this repository.
"~/.config/mise/config.toml" = ".config/mise/config.toml"
# Link only config.toml; ~/.config/herdr also holds sockets, logs, sessions, and plugins.
"~/.config/herdr/config.toml" = ".config/herdr/config.toml"
# Link only user-authored Claude Code files; ~/.claude also holds sessions and credentials.
"~/.claude/settings.json" = ".claude/settings.json"
"~/.claude/hooks" = ".claude/hooks"

# Hooks run on every bootstrap, so each step must be safe to repeat.
[bootstrap.hooks.post-tools]
run = [
  "\"$HOME/.tmux/plugins/tpm/bin/install_plugins\"",
  # Herdr has no declarative plugin list; install builds with mise's Go.
  "mise exec -- bash -c 'herdr plugin list | grep -Fq -- \"- herdr.auto-title \" || herdr plugin install kryptamine/herdr-auto-title --yes'",
]

[tasks.check]
description = "Check shell syntax"
run = "zsh -n .zshrc .zshenv"
